services:
  platonus_bot:
    build: .
    container_name: platonus_bot
    # Бот будет автоматически перезапускаться при сбоях или рестарте сервера
    restart: unless-stopped
    
    # Подключаем файл с токеном Telegram и ключом шифрования
    env_file:
      - .env
      
    # Прокидываем ТОЛЬКО папку с базой данных, чтобы она не удалилась
    # при обновлении бота. Сам код уже запечен в образ!
    volumes:
      - .:/app
      
    # В облаке мы просто запускаем главный файл
    command: python main.py